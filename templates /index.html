
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Python Code Fixer</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:25px;
    background:#0d1117;
    color:#e6edf3;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:16px;
}

.card h2{
    margin:0 0 12px;
    font-size:18px;
}

textarea{
    width:100%;
    height:250px;
    resize:vertical;
    padding:14px;
    border-radius:9px;
    border:1px solid #30363d;
    background:#010409;
    color:#c9d1d9;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.5;
    outline:none;
}

textarea:focus{
    border-color:#58a6ff;
}

.warning{
    margin:10px 0;
    padding:9px;
    border-radius:7px;
    background:#302600;
    color:#f2cc60;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 20px;
    cursor:pointer;
    font-weight:bold;
}

.run{
    background:#238636;
    color:white;
}

.fix{
    background:#8957e5;
    color:white;
}

.status{
    margin-top:9px;
    font-size:13px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<h1>🐍 Python Code Fixer</h1>

<div class="grid" id="editorGrid"></div>

<script>

const registeredEditors = 5;

const defaultCode = `def hello():
print("Hello World")`;

const grid = document.getElementById("editorGrid");


/* CREATE FIVE EDITORS */

for(let i = 1; i <= registeredEditors; i++){

    grid.innerHTML += `
    <div class="card">

        <h2>Python Editor ${i}</h2>

        <textarea id="code${i}">${defaultCode}</textarea>

        <div class="warning" id="warning${i}">
            ⚠ Indentation warning
        </div>

        <div class="buttons">

            <button class="run"
                    onclick="runCode(${i})">
                Run
            </button>

            <button class="fix"
                    onclick="fixCode(${i})">
                Fix
            </button>

        </div>

        <div class="status" id="status${i}"></div>

    </div>
    `;
}


/* RUN */

async function runCode(id){

    const editor = document.getElementById("code" + id);

    const warning = document.getElementById("warning" + id);

    const code = editor.value;

    try{

        const response = await fetch("/run",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                code:code
            })
        });

        const data = await response.json();

        warning.textContent = data.message;

    }catch(error){

        warning.textContent =
            "⚠ Unable to connect to backend.";

    }
}


/* FIX */

async function fixCode(id){

    const editor = document.getElementById("code" + id);

    const warning = document.getElementById("warning" + id);

    const status = document.getElementById("status" + id);

    try{

        const response = await fetch("/fix",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                code:editor.value
            })
        });

        const data = await response.json();

        if(data.success){

            editor.value = data.code;

            warning.textContent =
                "✓ Complete code fixed";

            status.textContent =
                "Clean registered code loaded successfully.";

        }

    }catch(error){

        status.textContent =
            "⚠ Unable to connect to backend.";

    }
}

</script>

</body>
</html>
